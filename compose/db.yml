version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hasaki-mysql
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "33067:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../suitecrm:/suitecrm
    networks:
      - hasaki-network
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hasaki-phpmyadmin
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ../suitecrm:/suitecrm
    networks:
      - hasaki-network
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local

networks:
  hasaki-network:
    driver: bridge
