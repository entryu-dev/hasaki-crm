[tool.poetry]
name = "hasaki-crm-api"
version = "0.1.0"
description = "API for Hasaki CRM system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.103.1"
uvicorn = "^0.23.2"
pydantic = "^2.3.0"
sqlalchemy = "^2.0.23"
pymysql = "^1.1.0"
cryptography = "^41.0.5"

[tool.poetry.scripts]
start = "src.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
